<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f1">
  <title>Architecture Portfolio</title>
  <link rel="stylesheet" href="style.css?v=final-20261020">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">PORTFOLIO</div>
      <div class="tools">
        <button id="zoomOut" title="Zoom out">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="fullscreen-btn" class="fullscreen-btn" title="Fullscreen" aria-label="Enter fullscreen">⛶</button>
        <a href="portfolio.pdf" download="portfolio.pdf" title="Download portfolio PDF">PDF ↓</a>
      </div>
    </header>

    <section class="viewer" id="viewer">
      <button class="nav prev" id="prev" aria-label="Previous spread">‹</button>
      <div class="spread" id="spread"></div>
      <button class="nav next" id="next" aria-label="Next spread">›</button>
    </section>

    <footer class="footer"><span id="status" aria-live="polite">Loading…</span></footer>
  </main>
  <script src="viewer.js?v=final-20261020"></script>
</body>
</html>
